# One SNMP endpoint for whichever single USB UPS is connected.
agentaddress udp:127.0.0.1:1161
sysName ups-adapter
sysLocation Raspberry Pi 4
view upsView included .1.3.6.1.2.1.1
view upsView included .1.3.6.1.2.1.33
# Uncomment after replacing the community; add a separate line for each manager.
# rocommunity REPLACE_WITH_RANDOM_SECRET 127.0.0.1/32 -V upsView
# rocommunity REPLACE_WITH_RANDOM_SECRET 192.0.2.10/32 -V upsView
pass_persist .1.3.6.1.2.1.33 /usr/bin/python3 -u /usr/local/lib/ups-network-adapter/ups_mib.py --ups ups
